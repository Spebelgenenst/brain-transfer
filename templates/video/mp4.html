<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Transfer - player</title>
    <link rel="icon" href="./static/favicon.ico">
</head>
<style>
    .error {
        color: red;
    }
    video {
        height: 512px; /* Beispielgröße, anpassen nach Bedarf */
        image-rendering: crisp-edges; /* Fallback für Firefox */
        image-rendering: pixelated; /* Moderne Browser (Chrome, Edge, Safari) */
    }
</style>
<body>
    <button onclick="playPause()">Play/Pause</button>
    <button onclick="reset()">restart</button>
    <p id="fileDuration"></p>

    <video id="file">
        <source src="/get_file?transfer_type=video/mp4" type="video/mp4">
        Your browser does not support the video element. (please report)
    </video>

    <iframe width="1840" height="1035" src="https://www.youtube.com/embed/FhKuI-FgD60" title="8 Hour Sleep/ Black Screen/ soothing Lofi/ NewBeginnings" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
<script>
    var file = document.getElementById("file"); 

    file.addEventListener('loadedmetadata', function() {
        file.play();
        file.pause();
        file.currentTime = 0;
        document.getElementById("fileDuration").innerHTML = file.duration + " seconds";
    })

    function playPause() { 
    if (file.paused) 
        file.play(); 
    else 
        file.pause(); 
    }
    function reset() {
        file.pause();
        file.currentTime = 0;
    }
</script>
</html>
